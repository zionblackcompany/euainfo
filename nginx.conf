# Config para hospedagens com Nginx (ex.: cPanel com Nginx).
# Envie este arquivo NA RAIZ do site (public_html), junto com o index.html.
# Se o painel não reconhecer o arquivo automaticamente, informe o bloco abaixo
# no campo de configuração custom do vhost (local do site):
#
location / {
    try_files $uri $uri/ /index.html;
}
